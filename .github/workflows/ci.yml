name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore backend/WeatherRoute.slnx
      - name: Build
        run: dotnet build backend/WeatherRoute.slnx --no-restore -warnaserror
      - name: Test
        run: dotnet test backend/WeatherRoute.slnx --no-build --filter "Category!=Integration"
      - name: Contract tests (against public APIs)
        run: dotnet test backend/WeatherRoute.slnx --no-build --filter "Category=Integration"
        env:
          OPENROUTESERVICE_API_KEY: ${{ secrets.OPENROUTESERVICE_API_KEY }}
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint || true